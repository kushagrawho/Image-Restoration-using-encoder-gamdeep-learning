<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heritage Restoration AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #d4af37;
            --bg: #fdfbf7;
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            text-align: center; 
            background: var(--bg); 
            color: var(--primary);
            margin: 0; 
            padding: 20px; 
            position: relative; /* Necessary for absolute positioning of names */
        }

        /* Top Right Names Styling */
        .credits {
            position: absolute;
            top: 20px;
            right: 30px;
            text-align: right;
            font-family: 'Cinzel', serif;
            font-size: 12px;
            letter-spacing: 1px;
            line-height: 1.5;
            color: var(--primary);
            border-right: 3px solid var(--accent);
            padding-right: 10px;
        }

        h1 { 
            font-family: 'Cinzel', serif; 
            font-size: 2.5rem; 
            margin-top: 60px; /* Added margin to avoid overlapping with names */
            margin-bottom: 10px;
            color: var(--primary);
        }

        .subtitle { opacity: 0.8; margin-bottom: 40px; }

        .upload-section { 
            background: white; 
            padding: 40px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 2px dashed #ccc;
            display: inline-block;
            transition: all 0.3s ease;
        }

        .upload-section:hover {
            border-color: var(--accent);
            transform: translateY(-5px);
        }

        button { 
            padding: 12px 30px; 
            background: var(--primary); 
            color: white; 
            border: none; 
            border-radius: 50px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: 600;
            transition: 0.3s;
        }

        button:hover { 
            background: var(--accent);
            color: var(--primary);
        }

        .container { 
            display: flex; 
            justify-content: center; 
            gap: 25px; 
            margin-top: 50px; 
            flex-wrap: wrap; 
            animation: fadeIn 0.8s ease-in;
        }

        .card { 
            background: white; 
            padding: 20px; 
            border-radius: 15px; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            border-top: 4px solid var(--accent);
        }

        img { 
            border-radius: 10px; 
            width: 280px; 
            height: 280px; 
            object-fit: cover; 
        }

        #loader {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            z-index: 1000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .spinner {
            width: 50px; height: 50px;
            border: 5px solid #eee;
            border-top: 5px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="credits">
        KUSHAGRA SINGH<br>
    </div>

    <div id="loader">
        <div class="spinner"></div>
        <p style="margin-top: 20px; font-weight: 600;">AI is reconstructing heritage data...</p>
    </div>

    <h1>🏛️ Heritage AI</h1>
    <p class="subtitle">Deep Learning Reconstruction for Historical Monuments</p>

    <div class="upload-section">
        <form method="post" enctype="multipart/form-data" onsubmit="showLoader()">
            <input type="file" name="file" accept="image/*" required>
            <button type="submit">Begin Restoration</button>
        </form>
    </div>

    {% if restored %}
    <div class="container">
        <div class="card">
            <h3>01. Original Input</h3>
            <img src="{{ url_for('static', filename='uploads/' + orig) }}">
        </div>
        <div class="card">
            <h3>02. Simulated Damage</h3>
            <img src="{{ url_for('static', filename='uploads/' + masked) }}">
        </div>
        <div class="card">
            <h3>03. AI Restoration</h3>
            <img src="{{ url_for('static', filename='uploads/' + restored) }}">
        </div>
    </div>
    {% endif %}

    <script>
        function showLoader() {
            document.getElementById('loader').style.display = 'flex';
        }
    </script>
</body>
</html>
